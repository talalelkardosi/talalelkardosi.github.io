name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify static output
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs'
          import { resolve } from 'node:path'

          const output = resolve('dist/client')
          const htmlPath = resolve(output, 'index.html')
          if (!existsSync(htmlPath)) throw new Error('Missing dist/client/index.html')
          const html = readFileSync(htmlPath, 'utf8')
          const assets = [...html.matchAll(/(?:src|href)="(\/[^"#?]+)"/g)]
            .map(([, path]) => path.slice(1))
          const missing = assets.filter((asset) => !existsSync(resolve(output, asset)))
          if (missing.length) throw new Error(`Missing static assets: ${missing.join(', ')}`)
          if (!html.includes('<title>Talal Al-Kardosi | Freelance Data Analyst</title>')) {
            throw new Error('Static index is missing the expected page title')
          }
          console.log(`Verified index.html and ${assets.length} local assets`)
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
